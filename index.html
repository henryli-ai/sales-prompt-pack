<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Prompt Pack - AI 銷售提示詞工具</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #662E8D;
            --primary-light: #7C4DB3;
            --primary-lighter: #A68BE0;
            --primary-pale: #E8E0F5;
            --secondary: #8D98B1;
            --dark: #252B3E;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
            --bg-light: #f8f9fa;
            --border: #e5e7eb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
            background:
                radial-gradient(ellipse at top left, rgba(102, 46, 141, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at top right, rgba(166, 139, 224, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at bottom left, rgba(141, 152, 177, 0.1) 0%, transparent 50%),
                linear-gradient(135deg, #f8f9ff 0%, #ffffff 100%);
            color: var(--dark);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            padding: 2rem 0;
            box-shadow: 0 4px 20px rgba(102, 46, 141, 0.15);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .header-subtitle {
            font-size: 1rem;
            opacity: 0.95;
            font-weight: 400;
        }

        /* Controls */
        .controls {
            background: white;
            border-bottom: 2px solid var(--primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .controls-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem 2rem;
        }

        .search-box {
            width: 100%;
            padding: 0.625rem 1rem;
            font-size: 0.9rem;
            border: 2px solid var(--border);
            border-radius: 6px;
            outline: none;
            transition: all 0.3s;
            font-family: 'Noto Sans TC', sans-serif;
            margin-bottom: 0.75rem;
        }

        .search-box:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-pale);
        }

        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
        }

        .filter-group-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.375rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.375rem;
        }

        .filter-btn {
            padding: 0.375rem 0.75rem;
            border: 2px solid var(--primary);
            background: white;
            color: var(--primary);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
            font-size: 0.8rem;
            font-family: 'Noto Sans TC', sans-serif;
        }

        .filter-btn:hover {
            background: var(--primary-pale);
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
        }

        /* Stats */
        .stats {
            max-width: 1400px;
            margin: 0.875rem auto;
            padding: 0 2rem;
            text-align: center;
            font-size: 0.85rem;
            color: var(--secondary);
        }

        .stats strong {
            color: var(--primary);
            font-weight: 700;
            font-size: 1rem;
        }

        /* Main Content */
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem 2rem;
        }

        .prompts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.875rem;
            align-items: start;
        }

        @media (max-width: 1200px) {
            .prompts-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Card */
        .prompt-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 16px;
            box-shadow:
                0 8px 32px rgba(102, 46, 141, 0.12),
                0 2px 8px rgba(0, 0, 0, 0.05),
                inset 0 1px 1px rgba(255, 255, 255, 0.9);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-left: 5px solid;
            border-left-color: var(--primary);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .prompt-card:hover {
            transform: translateY(-2px);
            box-shadow:
                0 12px 48px rgba(102, 46, 141, 0.18),
                0 4px 12px rgba(0, 0, 0, 0.08),
                inset 0 1px 1px rgba(255, 255, 255, 0.9);
        }

        .prompt-card.expanded {
            cursor: default;
        }

        .prompt-card.expanded:hover {
            transform: none;
        }

        .card-header {
            background: linear-gradient(135deg,
                rgba(232, 224, 245, 0.5) 0%,
                rgba(255, 255, 255, 0.3) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 0.75rem 1rem;
            border-bottom: 1px solid rgba(102, 46, 141, 0.1);
            position: relative;
        }

        .card-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(255, 255, 255, 0.6) 50%,
                transparent 100%);
        }

        /* Expand Button */
        .expand-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.375rem;
            padding: 0.5rem;
            margin-top: 0.5rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.8rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(102, 46, 141, 0.2);
        }

        .expand-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 46, 141, 0.35);
        }

        .expand-icon {
            transition: transform 0.3s;
            font-size: 1.2em;
        }

        .prompt-card.expanded .expand-icon {
            transform: rotate(180deg);
        }

        /* Collapsible Content */
        .card-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .prompt-card.expanded .card-content {
            max-height: 5000px;
        }

        .card-meta {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.625rem;
            flex-wrap: wrap;
        }

        .badge {
            padding: 0.25rem 0.625rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .badge-id {
            background: var(--dark);
            color: white;
        }

        .badge-category {
            background: var(--primary);
            color: white;
        }

        .badge-stage {
            background: var(--secondary);
            color: white;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 0;
            line-height: 1.3;
        }

        /* Info Blocks */
        .info-block {
            padding: 0.75rem 1rem;
            border-radius: 6px;
            margin-bottom: 0.875rem;
            border-left: 3px solid;
        }

        .info-block-when {
            background: #fffbeb;
            border-left-color: var(--warning);
        }

        .info-block-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--warning);
            margin-bottom: 0.375rem;
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }

        .info-block-content {
            color: var(--dark);
            font-size: 0.85rem;
        }

        /* Card Body */
        .card-body {
            padding: 0.75rem 1rem;
        }

        /* Variables Section */
        .variables-section {
            background: linear-gradient(135deg,
                rgba(59, 130, 246, 0.05) 0%,
                rgba(147, 197, 253, 0.08) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 0.875rem;
            border-radius: 10px;
            margin-bottom: 0.875rem;
            border: 1px solid rgba(59, 130, 246, 0.2);
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.08);
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--border);
        }

        .section-icon {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, var(--info) 0%, #2563eb 100%);
            color: white;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--dark);
            flex: 1;
        }

        .step-number {
            background: linear-gradient(135deg, var(--info) 0%, #2563eb 100%);
            color: white;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
        }

        .variables-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.625rem;
        }

        .variable-item {
            display: flex;
            flex-direction: column;
        }

        .variable-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 0.25rem;
        }

        .variable-input {
            width: 100%;
            padding: 0.5rem 0.625rem;
            border: 1px solid rgba(59, 130, 246, 0.2);
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 6px;
            font-size: 0.8rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Courier New', monospace;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .variable-input:focus {
            outline: none;
            border-color: rgba(59, 130, 246, 0.5);
            background: rgba(255, 255, 255, 0.8);
            box-shadow:
                0 0 0 3px rgba(59, 130, 246, 0.1),
                inset 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .variable-input:hover {
            border-color: rgba(59, 130, 246, 0.3);
        }

        /* Generated Section */
        .generated-section {
            background: linear-gradient(135deg,
                rgba(16, 185, 129, 0.05) 0%,
                rgba(167, 243, 208, 0.08) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 0.875rem;
            border-radius: 10px;
            margin-bottom: 0.875rem;
            border: 1px solid rgba(16, 185, 129, 0.2);
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.08);
        }

        .generated-section .section-icon {
            background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
        }

        .generated-section .step-number {
            background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
        }

        /* Templates Section */
        .templates-section {
            background: linear-gradient(135deg,
                rgba(102, 46, 141, 0.05) 0%,
                rgba(166, 139, 224, 0.08) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 0.875rem;
            border-radius: 10px;
            border: 1px solid rgba(102, 46, 141, 0.2);
            box-shadow: 0 4px 16px rgba(102, 46, 141, 0.08);
        }

        .templates-section .section-icon {
            background: var(--primary);
        }

        .template-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.625rem;
            margin-bottom: 0.875rem;
        }

        .template-tab {
            padding: 0.625rem;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(102, 46, 141, 0.3);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            box-shadow: 0 2px 4px rgba(102, 46, 141, 0.08);
        }

        .template-tab:hover {
            background: rgba(232, 224, 245, 0.4);
            border-color: rgba(102, 46, 141, 0.5);
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(102, 46, 141, 0.15);
        }

        .template-tab.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            border-color: var(--primary);
            box-shadow:
                0 4px 12px rgba(102, 46, 141, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .template-tab-title {
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 0.125rem;
        }

        .template-tab-desc {
            font-size: 0.7rem;
            opacity: 0.8;
        }

        /* Prompt Display */
        .prompt-display {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 0.875rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            line-height: 1.6;
            color: var(--dark);
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin-bottom: 0.625rem;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.05);
        }

        .prompt-display-generated {
            border: 1px solid rgba(16, 185, 129, 0.3);
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.1);
        }

        .prompt-display-template {
            border: 1px solid rgba(102, 46, 141, 0.3);
            box-shadow: 0 2px 8px rgba(102, 46, 141, 0.1);
        }

        /* Buttons */
        .copy-btn {
            width: 100%;
            padding: 0.625rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.8rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.375rem;
            font-family: 'Noto Sans TC', sans-serif;
        }

        .copy-btn-generated {
            background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
            color: white;
            box-shadow:
                0 4px 12px rgba(16, 185, 129, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .copy-btn-generated::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(255, 255, 255, 0.2) 50%,
                transparent 100%);
            transition: left 0.5s;
        }

        .copy-btn-generated:hover::before {
            left: 100%;
        }

        .copy-btn-generated:hover {
            transform: translateY(-2px);
            box-shadow:
                0 6px 20px rgba(16, 185, 129, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .copy-btn-template {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            box-shadow:
                0 4px 12px rgba(102, 46, 141, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .copy-btn-template::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(255, 255, 255, 0.2) 50%,
                transparent 100%);
            transition: left 0.5s;
        }

        .copy-btn-template:hover::before {
            left: 100%;
        }

        .copy-btn-template:hover {
            transform: translateY(-2px);
            box-shadow:
                0 6px 20px rgba(102, 46, 141, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .copy-btn.copied {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%) !important;
        }

        /* Notes */
        .notes {
            background: #fef3c7;
            border-left: 3px solid #f59e0b;
            padding: 0.75rem 0.875rem;
            border-radius: 5px;
            margin-top: 0.875rem;
        }

        .notes-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: #92400e;
            margin-bottom: 0.25rem;
        }

        .notes-content {
            font-size: 0.75rem;
            color: #78350f;
        }

        /* No Results */
        .no-results {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--secondary);
        }

        .no-results-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .no-results-text {
            font-size: 1.25rem;
            font-weight: 600;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-light);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--secondary);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.5rem;
            }

            .card-title {
                font-size: 1.25rem;
            }

            .variables-grid {
                grid-template-columns: 1fr;
            }

            .template-tabs {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-content">
            <h1>📚 Sales Prompt Pack</h1>
            <p class="header-subtitle">AI 銷售提示詞工具 - 25 條精選 Prompts · 填寫變數 · 即時生成</p>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <div class="controls-content">
            <input type="text" class="search-box" id="searchBox" placeholder="🔍 搜尋 Prompt 名稱、使用時機、變數...">

            <div class="filters">
                <div>
                    <div class="filter-group-label">分類 Category</div>
                    <div class="filter-buttons" id="categoryFilters"></div>
                </div>
                <div>
                    <div class="filter-group-label">階段 Stage</div>
                    <div class="filter-buttons" id="stageFilters"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Stats -->
    <div class="stats" id="stats"></div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="prompts-grid" id="promptsGrid"></div>
        <div class="no-results" id="noResults" style="display: none;">
            <div class="no-results-icon">😕</div>
            <div class="no-results-text">沒有找到符合條件的 Prompt</div>
            <p style="margin-top: 0.5rem;">試試調整搜尋條件或篩選器</p>
        </div>
    </div>

    <script src="prompts-data.js"></script>
    <script>
        let currentCategory = 'all';
        let currentStage = 'all';
        let searchTerm = '';
        let activeTemplates = {}; // 儲存每張卡片的活動範本（quick/robust）

        const stageGroups = {
            '銷售流程': ['Prospecting', 'Demo', 'Renewal', 'Discovery'],
            '策略規劃': ['Planning', 'Account Planning', 'Expansion'],
            '團隊管理': ['Mgmt', 'Daily Ops', 'Internal'],
            '賦能培訓': ['Enablement'],
            '資料分析': ['Pipeline', 'Performance']
        };

        function init() {
            renderFilters();
            renderPrompts();
            updateStats();

            document.getElementById('searchBox').addEventListener('input', (e) => {
                searchTerm = e.target.value.toLowerCase();
                renderPrompts();
                updateStats();
            });
        }

        function renderFilters() {
            const categories = ['all', ...new Set(promptsData.map(p => p.Category))];
            const stageGroupNames = ['all', ...Object.keys(stageGroups)];

            const categoryFilters = document.getElementById('categoryFilters');
            categoryFilters.innerHTML = categories.map(cat => `
                <button class="filter-btn ${cat === 'all' ? 'active' : ''}"
                        onclick="filterByCategory('${cat}')">
                    ${cat === 'all' ? '全部' : cat}
                </button>
            `).join('');

            const stageFilters = document.getElementById('stageFilters');
            stageFilters.innerHTML = stageGroupNames.map(stage => `
                <button class="filter-btn ${stage === 'all' ? 'active' : ''}"
                        onclick="filterByStage('${stage}')">
                    ${stage === 'all' ? '全部' : stage}
                </button>
            `).join('');
        }

        function filterByCategory(category) {
            currentCategory = category;
            updateFilterButtons('categoryFilters', category);
            renderPrompts();
            updateStats();
        }

        function filterByStage(stage) {
            currentStage = stage;
            updateFilterButtons('stageFilters', stage);
            renderPrompts();
            updateStats();
        }

        function updateFilterButtons(containerId, activeValue) {
            const container = document.getElementById(containerId);
            container.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent.trim() === activeValue ||
                    (activeValue === 'all' && btn.textContent.includes('全部'))) {
                    btn.classList.add('active');
                }
            });
        }

        function getFilteredPrompts() {
            return promptsData.filter(prompt => {
                const matchesCategory = currentCategory === 'all' || prompt.Category === currentCategory;

                let matchesStage = currentStage === 'all';
                if (!matchesStage && currentStage !== 'all') {
                    const stagesInGroup = stageGroups[currentStage] || [];
                    matchesStage = stagesInGroup.includes(prompt.Stage);
                }

                const matchesSearch = !searchTerm ||
                    prompt['Use Case'].toLowerCase().includes(searchTerm) ||
                    prompt['When to Use'].toLowerCase().includes(searchTerm) ||
                    prompt['Variable List'].toLowerCase().includes(searchTerm) ||
                    prompt['Prompt Quick ZH'].toLowerCase().includes(searchTerm) ||
                    prompt['Prompt Robust ZH'].toLowerCase().includes(searchTerm) ||
                    prompt.ID.toLowerCase().includes(searchTerm);

                return matchesCategory && matchesStage && matchesSearch;
            });
        }

        function parseVariables(variableList) {
            if (!variableList) return [];

            const lines = variableList.split('\n');
            const variables = [];

            lines.forEach(line => {
                const match = line.match(/\{\{(.+?)\}\}=(.+)/);
                if (match) {
                    variables.push({
                        key: match[1].trim(),
                        label: match[2].trim()
                    });
                }
            });

            return variables;
        }

        function renderPrompts() {
            const filtered = getFilteredPrompts();
            const grid = document.getElementById('promptsGrid');
            const noResults = document.getElementById('noResults');

            if (filtered.length === 0) {
                grid.style.display = 'none';
                noResults.style.display = 'block';
                return;
            }

            grid.style.display = 'grid';
            noResults.style.display = 'none';

            grid.innerHTML = filtered.map((prompt, index) => {
                const variables = parseVariables(prompt['Variable List']);
                const hasVariables = variables.length > 0;

                // 初始化活動範本為快速版
                if (!activeTemplates[index]) {
                    activeTemplates[index] = 'quick';
                }

                return `
                <div class="prompt-card" onclick="toggleCard(${index}, event)">
                    <!-- Card Header -->
                    <div class="card-header">
                        <div class="card-meta">
                            <span class="badge badge-id">${prompt.ID}</span>
                            <span class="badge badge-category">${prompt.Category}</span>
                            <span class="badge badge-stage">${prompt.Stage}</span>
                        </div>
                        <h2 class="card-title">${prompt['Use Case']}</h2>
                    </div>

                    <!-- Card Summary (Always Visible) -->
                    <div class="card-body">
                        ${prompt['When to Use'] ? `
                        <div class="info-block info-block-when">
                            <div class="info-block-title">📌 使用時機</div>
                            <div class="info-block-content">${prompt['When to Use']}</div>
                        </div>
                        ` : ''}

                        <button class="expand-btn" onclick="toggleCard(${index}, event)">
                            <span class="expand-text">展開填寫</span>
                            <span class="expand-icon">▼</span>
                        </button>
                    </div>

                    <!-- Collapsible Content -->
                    <div class="card-content">
                        <div class="card-body">
                        ${hasVariables ? `
                        <!-- Step 1: Variables -->
                        <div class="variables-section">
                            <div class="section-header">
                                <div class="step-number">1</div>
                                <div class="section-title">填寫變數</div>
                            </div>
                            <div class="variables-grid">
                                ${variables.map(v => `
                                    <div class="variable-item">
                                        <label class="variable-label">${v.label}</label>
                                        <input type="text"
                                               class="variable-input"
                                               data-card-index="${index}"
                                               data-variable-key="${v.key}"
                                               placeholder="請填寫..."
                                               oninput="updateGeneratedPrompt(${index})">
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Step 2: Generated -->
                        <div class="generated-section">
                            <div class="section-header">
                                <div class="step-number">2</div>
                                <div class="section-title">已生成的 Prompt（可直接使用）</div>
                            </div>
                            <div class="prompt-display prompt-display-generated" id="generated-${index}">${escapeHtml(prompt['Prompt Quick ZH'])}</div>
                            <button class="copy-btn copy-btn-generated" onclick="copyPrompt(document.getElementById('generated-${index}').textContent, this, event)">
                                📋 複製已生成的 Prompt
                            </button>
                        </div>
                        ` : ''}

                        <!-- Step 3: Templates -->
                        <div class="templates-section">
                            <div class="section-header">
                                <div class="step-number">${hasVariables ? '3' : '1'}</div>
                                <div class="section-title">原始範本（可複製到 AI 聊天室修改）</div>
                            </div>

                            ${prompt['Prompt Quick ZH'] && prompt['Prompt Robust ZH'] ? `
                            <div class="template-tabs">
                                <div class="template-tab ${activeTemplates[index] === 'quick' ? 'active' : ''}"
                                     onclick="switchTemplate(${index}, 'quick', event)">
                                    <div class="template-tab-title">快速版</div>
                                    <div class="template-tab-desc">簡潔好用</div>
                                </div>
                                <div class="template-tab ${activeTemplates[index] === 'robust' ? 'active' : ''}"
                                     onclick="switchTemplate(${index}, 'robust', event)">
                                    <div class="template-tab-title">強化版</div>
                                    <div class="template-tab-desc">完整詳細</div>
                                </div>
                            </div>
                            ` : ''}

                            <div class="prompt-display prompt-display-template" id="template-${index}">
                                ${escapeHtml(prompt['Prompt Quick ZH'] || '')}
                            </div>
                            <button class="copy-btn copy-btn-template" onclick="copyTemplate(${index}, this, event)">
                                📋 複製範本
                            </button>
                        </div>

                        ${prompt.Notes ? `
                        <div class="notes">
                            <div class="notes-title">💡 備註</div>
                            <div class="notes-content">${prompt.Notes}</div>
                        </div>
                        ` : ''}
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        function toggleCard(cardIndex, event) {
            event.stopPropagation();
            const cards = document.querySelectorAll('.prompt-card');
            const card = cards[cardIndex];

            if (card) {
                card.classList.toggle('expanded');
                const expandText = card.querySelector('.expand-text');
                if (expandText) {
                    expandText.textContent = card.classList.contains('expanded') ? '收起' : '展開填寫';
                }
            }
        }

        function switchTemplate(cardIndex, type, event) {
            if (event) event.stopPropagation();

            activeTemplates[cardIndex] = type;
            const filtered = getFilteredPrompts();
            const prompt = filtered[cardIndex];

            const templateDisplay = document.getElementById(`template-${cardIndex}`);
            const promptText = type === 'quick' ? prompt['Prompt Quick ZH'] : prompt['Prompt Robust ZH'];
            templateDisplay.textContent = promptText;

            // 更新 tabs 狀態
            const card = templateDisplay.closest('.prompt-card');
            card.querySelectorAll('.template-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            card.querySelectorAll('.template-tab')[type === 'quick' ? 0 : 1].classList.add('active');
        }

        function copyTemplate(cardIndex, button, event) {
            if (event) event.stopPropagation();

            const templateDisplay = document.getElementById(`template-${cardIndex}`);
            copyPrompt(templateDisplay.textContent, button);
        }

        function updateGeneratedPrompt(cardIndex) {
            const filtered = getFilteredPrompts();
            const prompt = filtered[cardIndex];

            let generatedPrompt = prompt['Prompt Quick ZH'];

            const inputs = document.querySelectorAll(`input[data-card-index="${cardIndex}"]`);

            inputs.forEach(input => {
                const variableKey = input.dataset.variableKey;
                const value = input.value.trim();

                if (value) {
                    const regex = new RegExp(`\\{\\{${variableKey}\\}\\}`, 'g');
                    generatedPrompt = generatedPrompt.replace(regex, value);
                }
            });

            const generatedElement = document.getElementById(`generated-${cardIndex}`);
            if (generatedElement) {
                generatedElement.textContent = generatedPrompt;
            }
        }

        function updateStats() {
            const filtered = getFilteredPrompts();
            const stats = document.getElementById('stats');
            stats.innerHTML = `顯示 <strong>${filtered.length}</strong> 個 Prompt（共 <strong>${promptsData.length}</strong> 個）`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function copyPrompt(text, button, event) {
            if (event) event.stopPropagation();

            navigator.clipboard.writeText(text).then(() => {
                const originalText = button.innerHTML;
                button.innerHTML = '✅ 已複製！';
                button.classList.add('copied');

                setTimeout(() => {
                    button.innerHTML = originalText;
                    button.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                alert('複製失敗：' + err.message);
            });
        }

        init();
    </script>
</body>
</html>
